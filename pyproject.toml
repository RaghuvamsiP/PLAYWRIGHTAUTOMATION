[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crc-automation"
version = "0.1.0"
description = "Playwright + pytest automation framework for Credit Repair Cloud"
requires-python = ">=3.10"
dependencies = [
    "playwright",
    "pytest",
    "pytest-playwright",
    "pytest-xdist",
    "pytest-repeat",
    "allure-pytest",
    "requests",
    "faker",
    "python-dotenv",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# `pythonpath` lets the suite import crc_automation straight from src/,
# so `pip install -e .` is optional for a local run.
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-s -v --alluredir=reports/allure-results --clean-alluredir"
norecursedirs = ["venv", ".git", "__pycache__", "reports", "sandbox", "node_modules"]
markers = [
    "smoke: Smoke tests for quick sanity checks",
    "sanity: Sanity tests for core functionality validation",
    "regression: Full regression tests",
    "negative: Negative tests for invalid inputs and error handling",
    "ui: UI tests",
    "api: API tests",
    "no_balance_restore: Skip the auto-restore wallet-balance fixture for this test",
]
